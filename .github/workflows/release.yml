name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed without cutting one.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts without publishing
        type: boolean
        default: true

permissions:
  contents: write
  # Required for build provenance attestation.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # §16: macOS arm64 and x86_64, Linux x86_64 and aarch64.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: The binary runs before it is shipped
        # A cross-built artifact cannot be smoke-tested, but a native one can,
        # and shipping a binary that will not start is the worst release bug.
        if: matrix.target != 'aarch64-unknown-linux-gnu' || runner.arch == 'ARM64'
        run: ./target/${{ matrix.target }}/release/kosong --version

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # A tag names a version; the manifest defines one. Nothing until now
          # made them agree, so a mistyped tag — or a forgotten version bump —
          # would ship an archive whose name contradicts the binary inside it,
          # with a signed attestation vouching for the pair. A prerelease
          # suffix is allowed, but the version it qualifies must be the real
          # one: v0.1.1-rc.1 requires the manifest to already say 0.1.1.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            CRATE=$(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name == "kosong-cli") | .version')
            if [ "${VERSION%%-*}" != "$CRATE" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the crate version ${CRATE}"
              echo "Bump the workspace version in Cargo.toml, or retag." >&2
              exit 1
            fi
          fi

          NAME="kosong-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"

          cp "target/${{ matrix.target }}/release/kosong" "dist/$NAME/"
          # LICENSE is not optional: Apache-2.0 §4(a) requires that recipients
          # of the work receive a copy of the licence with it.
          cp LICENSE "dist/$NAME/"
          cp README.md SECURITY.md CHANGELOG.md "dist/$NAME/" 2>/dev/null || true

          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"

          # A checksum per artifact, so a download can be verified on its own.
          ( cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )

          echo "archive=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        # §16 asks for provenance where the tooling supports it. This records,
        # verifiably, which workflow and which commit produced the artifact.
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: One manifest for every artifact
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Verifying this download

            Every archive is checksummed. Before installing, check that what you
            downloaded is what was built:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            The installer at https://get.kosong.dev does this for you.
