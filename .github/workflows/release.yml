name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed without cutting one.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts without publishing
        type: boolean
        default: true

permissions:
  contents: write
  # Required for build provenance attestation.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # §16: macOS arm64 and x86_64, Linux x86_64 and aarch64.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          # This job runs `cargo build`, which executes build.rs from every
          # third-party crate in the tree. Checkout otherwise writes the job's
          # GITHUB_TOKEN into .git/config, where any of that code could read
          # it — and with no job-level permissions block, that token carries
          # the workflow's `contents: write`. Nothing here pushes.
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: The binary runs before it is shipped
        # A cross-built artifact cannot be smoke-tested, but a native one can,
        # and shipping a binary that will not start is the worst release bug.
        if: matrix.target != 'aarch64-unknown-linux-gnu' || runner.arch == 'ARM64'
        run: ./target/${{ matrix.target }}/release/kosong --version

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          CRATE=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "kosong-cli") | .version')

          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # A tag names a version; the manifest defines one. Nothing until now
            # made them agree, so a mistyped tag — or a forgotten version bump —
            # would ship an archive whose name contradicts the binary inside it,
            # with a signed attestation vouching for the pair. A prerelease
            # suffix is allowed, but the version it qualifies must be the real
            # one: v0.1.1-rc.1 requires the manifest to already say 0.1.1.
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION%%-*}" != "$CRATE" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the crate version ${CRATE}"
              echo "Bump the workspace version in Cargo.toml, or retag." >&2
              exit 1
            fi
          else
            # A rehearsal has no tag, and `${GITHUB_REF_NAME#v}` is then the
            # branch name. That produced archives called
            # `kosong-reproducible-archives-x86_64-unknown-linux-gnu.tar.gz`,
            # which the npm job could not find because it looks for the manifest
            # version — so `workflow_dispatch` failed at the step it exists to
            # rehearse, and had done since the npm job was added.
            #
            # The manifest is the right answer here anyway: a branch name is not
            # a version, and it has no business in an artifact name.
            VERSION="$CRATE"
          fi

          NAME="kosong-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"

          cp "target/${{ matrix.target }}/release/kosong" "dist/$NAME/"
          # LICENSE is not optional: Apache-2.0 §4(a) requires that recipients
          # of the work receive a copy of the licence with it.
          cp LICENSE "dist/$NAME/"
          cp README.md SECURITY.md CHANGELOG.md "dist/$NAME/" 2>/dev/null || true

          # --- A reproducible archive ------------------------------------
          #
          # `tar -czf` embeds three things that change between runs of the same
          # source, so every rebuild produced a different checksum. Re-tagging
          # v0.2.0 made that visible: all four archives changed hash while every
          # file inside them, the binaries included, was byte-identical. The
          # gzip headers were 718 seconds apart — the gap between the two runs.
          #
          # That matters for a project that ships checksums and tells people to
          # check them. A checksum you cannot reproduce proves the download
          # matches what was published, but nothing about what was published
          # matching the source. These three lines close that.
          #
          # 1. mtimes, taken from the commit being built. `git log --date=format`
          #    emits `touch -t` syntax directly, which `date` cannot do portably:
          #    BSD wants `-r EPOCH`, GNU wants `-d @EPOCH`, and the runners are
          #    one of each.
          # 2. entry order, pinned by sorting rather than trusting readdir.
          # 3. the gzip timestamp, removed by `-n`.
          #
          # Ownership is deliberately left alone. It does not vary between runs
          # on a given runner image, and normalising it portably needs an OS
          # branch — bsdtar takes `--uid`, GNU tar takes `--owner`, and neither
          # accepts the other's spelling.
          STAMP="$(git log -1 --format=%cd --date=format:'%Y%m%d%H%M.%S')"
          find "dist/$NAME" -exec touch -t "$STAMP" {} +
          ( cd dist && ls -A "$NAME" | sort | sed "s|^|$NAME/|" > .filelist )
          ( cd dist && tar -cf - -T .filelist | gzip -n > "$NAME.tar.gz" && rm -f .filelist )

          # A checksum per artifact, so a download can be verified on its own.
          ( cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )

          echo "archive=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        # §16 asks for provenance where the tooling supports it. This records,
        # verifiably, which workflow and which commit produced the artifact.
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          # action-gh-release takes the token through the environment, not the
          # git config, so persisting it buys nothing and leaves a
          # `contents: write` credential on disk.
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: One manifest for every artifact
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Verifying this download

            Every archive is checksummed. Before installing, check that what you
            downloaded is what was built:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            The installer at https://kosong.thefutureissolo.com/install.sh does this for you.

  npm:
    name: npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing (OIDC), so no long-lived NPM_TOKEN exists to leak.
      # The same token type the attestation step above already uses.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # This job runs `npm install -g npm@latest` and `npm publish`, both of
          # which execute registry code. The job's permissions block already
          # reduces the token to id-token only; not writing it to disk at all
          # is free.
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Deliberately no `registry-url`. It looks like the thing to set for
          # a job that publishes to npm, and it is what broke two releases.
          #
          # `registry-url` makes setup-node write an .npmrc containing
          # `_authToken=${NODE_AUTH_TOKEN}`, `registry=…` and `always-auth`,
          # and export NODE_AUTH_TOKEN as the literal placeholder
          # `XXXXX-XXXXX-XXXXX-XXXXX`. npm then sends that placeholder as a
          # credential — and `always-auth` means it does so on every request,
          # so there is no path back to OIDC. The registry answers an
          # unauthorised package with 404, which is why two tagged releases
          # failed with "could not be found or you do not have permission" on
          # packages that plainly exist.
          #
          # Nothing is lost by dropping it: the diagnostic step below reported
          # the registry as https://registry.npmjs.org/, which is npm's default
          # with no .npmrc at all. npm's own trusted-publishing guidance is
          # explicit that no NODE_AUTH_TOKEN should be present for the publish.

      - name: npm new enough to publish without a token
        # Trusted publishing needs npm 11.5.1 or later, and the runner's
        # bundled npm is older. Without this the publish falls back to looking
        # for a token that is deliberately not there.
        run: npm install -g npm@latest

      - name: What the publish will actually authenticate as
        # Two tagged releases failed here with a 404 on PUT against packages
        # that plainly exist, which is how the registry reports "not
        # authorised". Provenance signed both times, so the OIDC token itself
        # was fine — meaning npm never used it for the publish.
        #
        # The suspect is `setup-node`'s `registry-url`: it writes
        # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc and exports the literal
        # placeholder `XXXXX-XXXXX-XXXXX-XXXXX`, which npm then sends as a
        # credential. npm's own trusted-publishing guidance says no
        # NODE_AUTH_TOKEN should be present for the publish step.
        #
        # This step exists so a `workflow_dispatch` can answer that without
        # burning a tag. It prints no secret: the token is masked by the runner,
        # and only the shape of the .npmrc line is shown.
        run: |
          set -euo pipefail
          echo "npm:  $(npm --version)"
          echo "node: $(node --version)"
          echo "registry: $(npm config get registry)"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes}${NODE_AUTH_TOKEN:-no}"
          # NPM_CONFIG_USERCONFIG is where `setup-node` actually puts it —
          # $HOME/.npmrc is not read at all, which the first run of this step
          # established by reporting both candidates absent.
          for f in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" "$GITHUB_WORKSPACE/.npmrc"; do
            [ -n "$f" ] || continue
            if [ -f "$f" ]; then
              echo "--- $f"
              sed 's/=.*/=<redacted>/' "$f"
            else
              echo "--- $f (absent)"
            fi
          done

      - name: Build the packages
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # On workflow_dispatch there is no tag, so the manifest decides and
          # the generator's own agreement check is a no-op.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            node npm/build.mjs --artifacts artifacts --version "$VERSION"
          else
            node npm/build.mjs --artifacts artifacts
            VERSION="$(node -p "require('./npm/dist/kosong/package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack, so a rehearsal produces something to inspect
        run: |
          set -euo pipefail
          mkdir -p npm/tarballs
          for package in npm/dist/@*/* npm/dist/kosong; do
            ( cd "$package" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm/tarballs" )
          done
          ls -l npm/tarballs

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm/tarballs/*.tgz
          if-no-files-found: error

      - name: Has the first release happened yet?
        id: bootstrap
        # Only on a tag. A rehearsal publishes nothing, so a registry that is
        # briefly unreachable should not fail a dry run that was never going to
        # touch it.
        if: github.event_name == 'push'
        # Trusted publishing is configured per package, and npm cannot configure
        # it for a package that does not exist — so the very first release is
        # published by hand and this job has nothing it can authenticate with.
        # Rather than fail the first tag and leave a red run in the history, it
        # detects the situation and says what to do.
        #
        # `kosong` is the right thing to probe because it is published *last*:
        # if the launcher exists, the platform packages it names do too.
        #
        # A 404 is the only answer treated as "not yet". Anything else — a
        # network blip, a registry outage, a proxy — fails the step, because
        # silently skipping a real publish is the one outcome worse than a red
        # run.
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' https://registry.npmjs.org/kosong)"
          case "$code" in
            200) echo "published=true"  >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::registry answered $code for kosong; cannot tell whether this is the first release"
              exit 1
              ;;
          esac
          echo "registry says kosong exists: $code"

      - name: The first release is published by hand
        if: github.event_name == 'push' && steps.bootstrap.outputs.published != 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          {
            echo "## npm — nothing published"
            echo
            echo "\`kosong\` is not on the registry yet, so trusted publishing cannot"
            echo "have been configured for it: npm only accepts that configuration for"
            echo "packages that already exist."
            echo
            echo "This release is published by hand, once. The tarballs built here are"
            echo "attached to this run as \`npm-packages\`, and the steps are in"
            echo "[npm/PUBLISHING.md](npm/PUBLISHING.md)."
            echo
            echo "After \`npm trust github\` has run for all five packages, this job"
            echo "publishes every later release on its own — no change needed here."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: github.event_name == 'push' && steps.bootstrap.outputs.published == 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail

          # Platform packages first, the launcher last. Its optionalDependencies
          # pin exact versions, so it must not exist before the things it names:
          # a launcher on the registry whose platform package is missing is an
          # install that succeeds and then cannot run, and npm versions are
          # immutable, so the repair is a new version rather than a fix.
          #
          # Everything goes to the `next` tag. `latest` is what
          # `npm install -g kosong` resolves, so until the tag is moved by hand
          # a partial publish is invisible to users, which is what makes it
          # recoverable.
          #
          # That holds here and does not hold generally: npm sets `latest` on a
          # package's *first* published version whatever `--tag` says, as all
          # five did on the 0.2.0 bootstrap. This job never publishes a first
          # `kosong`, because it does not run until one exists — so the launcher,
          # the package that decides what a user installs, is always a later
          # version with `latest` already parked on the release before it.
          #
          # A newly added platform package *is* a first publish and will take
          # `latest` immediately. That is harmless: the launcher pins exact
          # versions, so nothing resolves a platform package by tag. The order
          # below is what actually protects the release.
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "already published: $name@$VERSION"
              return 0
            fi
            ( cd "$1" && npm publish --provenance --access public --tag next )
          }

          for package in npm/dist/@*/*; do publish "$package"; done
          publish npm/dist/kosong

      - name: How to finish the release
        if: github.event_name == 'push' && steps.bootstrap.outputs.published == 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          {
            echo "## npm"
            echo
            echo "Published to the \`next\` tag. Nothing resolves \`npm install -g kosong\` yet."
            echo
            echo "Verify a real install, on macOS and on Linux:"
            echo
            echo '```bash'
            echo "npm install -g kosong@$VERSION"
            echo "kosong --version"
            echo '```'
            echo
            echo "Then, and only then:"
            echo
            echo '```bash'
            echo "npm dist-tag add kosong@$VERSION latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
