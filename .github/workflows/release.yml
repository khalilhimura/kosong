name: Release

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed without cutting one.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build artifacts without publishing
        type: boolean
        default: true

permissions:
  contents: write
  # Required for build provenance attestation.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # §16: macOS arm64 and x86_64, Linux x86_64 and aarch64.
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: The binary runs before it is shipped
        # A cross-built artifact cannot be smoke-tested, but a native one can,
        # and shipping a binary that will not start is the worst release bug.
        if: matrix.target != 'aarch64-unknown-linux-gnu' || runner.arch == 'ARM64'
        run: ./target/${{ matrix.target }}/release/kosong --version

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # A tag names a version; the manifest defines one. Nothing until now
          # made them agree, so a mistyped tag — or a forgotten version bump —
          # would ship an archive whose name contradicts the binary inside it,
          # with a signed attestation vouching for the pair. A prerelease
          # suffix is allowed, but the version it qualifies must be the real
          # one: v0.1.1-rc.1 requires the manifest to already say 0.1.1.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            CRATE=$(cargo metadata --format-version 1 --no-deps \
              | jq -r '.packages[] | select(.name == "kosong-cli") | .version')
            if [ "${VERSION%%-*}" != "$CRATE" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match the crate version ${CRATE}"
              echo "Bump the workspace version in Cargo.toml, or retag." >&2
              exit 1
            fi
          fi

          NAME="kosong-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"

          cp "target/${{ matrix.target }}/release/kosong" "dist/$NAME/"
          # LICENSE is not optional: Apache-2.0 §4(a) requires that recipients
          # of the work receive a copy of the licence with it.
          cp LICENSE "dist/$NAME/"
          cp README.md SECURITY.md CHANGELOG.md "dist/$NAME/" 2>/dev/null || true

          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"

          # A checksum per artifact, so a download can be verified on its own.
          ( cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" )

          echo "archive=dist/$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        # §16 asks for provenance where the tooling supports it. This records,
        # verifiably, which workflow and which commit produced the artifact.
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: One manifest for every artifact
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
          generate_release_notes: true
          body: |
            ## Verifying this download

            Every archive is checksummed. Before installing, check that what you
            downloaded is what was built:

            ```bash
            shasum -a 256 -c SHA256SUMS --ignore-missing
            ```

            The installer at https://kosong.thefutureissolo.com/install.sh does this for you.

  npm:
    name: npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing (OIDC), so no long-lived NPM_TOKEN exists to leak.
      # The same token type the attestation step above already uses.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: npm new enough to publish without a token
        # Trusted publishing needs npm 11.5.1 or later, and the runner's
        # bundled npm is older. Without this the publish falls back to looking
        # for a token that is deliberately not there.
        run: npm install -g npm@latest

      - name: Build the packages
        id: build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # On workflow_dispatch there is no tag, so the manifest decides and
          # the generator's own agreement check is a no-op.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            node npm/build.mjs --artifacts artifacts --version "$VERSION"
          else
            node npm/build.mjs --artifacts artifacts
            VERSION="$(node -p "require('./npm/dist/kosong/package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack, so a rehearsal produces something to inspect
        run: |
          set -euo pipefail
          mkdir -p npm/tarballs
          for package in npm/dist/@kosong/* npm/dist/kosong; do
            ( cd "$package" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm/tarballs" )
          done
          ls -l npm/tarballs

      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm/tarballs/*.tgz
          if-no-files-found: error

      - name: Publish
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail

          # Platform packages first, the launcher last. Its optionalDependencies
          # pin exact versions, so it must not exist before the things it names:
          # a launcher on the registry whose platform package is missing is an
          # install that succeeds and then cannot run, and npm versions are
          # immutable, so the repair is a new version rather than a fix.
          #
          # Everything goes to the `next` tag. `latest` is what
          # `npm install -g kosong` resolves, so until the tag is moved by hand
          # a partial publish is invisible to users. That is the whole reason
          # this is recoverable.
          publish() {
            name="$(node -p "require('./$1/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "already published: $name@$VERSION"
              return 0
            fi
            ( cd "$1" && npm publish --provenance --access public --tag next )
          }

          for package in npm/dist/@kosong/*; do publish "$package"; done
          publish npm/dist/kosong

      - name: How to finish the release
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          {
            echo "## npm"
            echo
            echo "Published to the \`next\` tag. Nothing resolves \`npm install -g kosong\` yet."
            echo
            echo "Verify a real install, on macOS and on Linux:"
            echo
            echo '```bash'
            echo "npm install -g kosong@$VERSION"
            echo "kosong --version"
            echo '```'
            echo
            echo "Then, and only then:"
            echo
            echo '```bash'
            echo "npm dist-tag add kosong@$VERSION latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
