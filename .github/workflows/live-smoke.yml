name: Live smoke

# Manual only, and gated on a protected environment.
#
# §15 requires "a manual, environment-protected live smoke workflow using a
# disposable GitHub account/repository and Cloudflare Pages project". Everything
# in CI runs against fakes, which proves kosong sends the right arguments but
# not that those arguments still mean what the providers think they mean.
#
# That distinction is the point. §13.4 warns that provider syntax drifts — and
# it already has: Wrangler has no Pages rollback command, contrary to what the
# specification assumed. Only a live run catches the next one.
#
# This never runs on a push. It costs real resources and touches real accounts.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "yes" to run against real accounts
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  smoke:
    name: Against real providers
    runs-on: ubuntu-latest
    if: inputs.confirm == 'yes'
    # Holds GH_TOKEN and CLOUDFLARE_API_TOKEN for a **disposable** account.
    # Never a personal one: this workflow creates and deletes repositories.
    environment: live-smoke
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build
        run: cargo build --release

      - name: Confirm the providers still speak the expected language
        # Checked before anything is created, so a syntax drift is reported
        # rather than discovered halfway through a deployment.
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm install -g wrangler

          gh auth status
          wrangler whoami

          # §13.4: the rollback situation is re-verified every run, because the
          # day this assertion fails is the day kosong could offer a real
          # `site rollback`.
          if wrangler pages deployment --help 2>&1 | grep -qi 'rollback'; then
            echo "::warning::Wrangler now has a Pages rollback command."
            echo "::warning::Revisit spec/extension-boundaries.md and site rollback."
          else
            echo "Confirmed: Wrangler still has no Pages rollback command."
          fi

      - name: A full publish, end to end
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/kosong"
          WORK="$(mktemp -d)"
          NAME="kosong-smoke-${GITHUB_RUN_ID}"
          export KOSONG_CONFIG_DIR="$WORK/config" KOSONG_SESSION_FILE="$WORK/session" NO_COLOR=1

          # Both are read by later steps. Each step is its own shell, so
          # anything the next one needs has to be written down here.
          echo "SMOKE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "SMOKE_WORK=$WORK" >> "$GITHUB_ENV"

          git config --global user.name "kosong smoke"
          git config --global user.email "smoke@example.invalid"

          "$BIN" --workspace "$WORK" new --title "Live Smoke ${GITHUB_RUN_ID}"
          "$BIN" --workspace "$WORK" site init "$NAME" --yes
          "$BIN" --workspace "$WORK" site publish --yes | tee "$WORK/publish.log"

          grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$WORK/publish.log" | head -1 > "$WORK/url"
          URL="$(cat "$WORK/url")"
          test -n "$URL"

          # Cloudflare needs a while to serve a brand new deployment, and the
          # wait got longer when kosong started creating the project itself.
          # The project used to be made by hand in the dashboard, long before a
          # run, so its `pages.dev` certificate was already issued by the time
          # anything was deployed to it. Now the project is seconds old, and the
          # first requests fail the TLS handshake outright rather than returning
          # an HTTP error — which is why this waits on `curl` succeeding at all
          # rather than on a status code.
          #
          # 150s was not enough: a run reached exactly that budget and then
          # failed on `sslv3 alert handshake failure`.
          deadline=$(( $(date +%s) + 600 ))
          until curl -fsS "$URL" >/dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::${URL} did not become reachable within 10 minutes."
              echo "Last attempt said:"
              curl -sS -o /dev/null "$URL" || true
              exit 1
            fi
            sleep 10
          done
          curl -fsS "$URL" | grep -q "Live Smoke ${GITHUB_RUN_ID}"
          echo "Published and reachable at $URL"

      - name: A failed build must not replace a working deployment
        # §13.3 and the Phase C exit gate. This is the assertion that matters
        # most: breaking a live site is worse than failing to update it.
        #
        # It is also the second publish of the run, so it is the step that
        # proves `npm install`'s lockfile no longer stops one.
        #
        # This step used to assert only that the publish exited non-zero, and
        # run 30335517886 shows why that is not enough: the publish did exit
        # non-zero, but on a stray `package-lock.json` at step 2, so the broken
        # build never ran and the assertion the step exists for was never
        # tested. It went green anyway. Every check below is therefore about
        # *why* the publish failed, not that it did.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/kosong"
          # The directory the previous step created, not whichever /tmp entry
          # happens to look newest. `set -u` fails here if it was never written.
          WORK="$SMOKE_WORK"
          export KOSONG_CONFIG_DIR="$WORK/config" KOSONG_SESSION_FILE="$WORK/session" NO_COLOR=1
          URL="$(cat "$WORK/url")"

          # Break the build deliberately.
          echo "this is not valid astro config" > "$WORK/$SMOKE_NAME/astro.config.mjs"

          # Both streams into one log: the reason is split across them. The step
          # the publish reached is on stdout, the failure itself on stderr.
          # `|| status=$?` rather than `if`, so the log is kept either way.
          status=0
          "$BIN" --workspace "$WORK" site publish --yes > "$WORK/broken.log" 2>&1 || status=$?
          cat "$WORK/broken.log"

          if [ "$status" -eq 0 ]; then
            echo "::error::publish succeeded despite a broken build"
            exit 1
          fi

          # 1. It has to have got as far as the build. Anything earlier — a
          #    dirty tree, a missing tool, a Cloudflare refusal — exits non-zero
          #    without ever testing what this step is here to test.
          if ! grep -q 'Building' "$WORK/broken.log"; then
            echo "::error::publish failed before it reached the build, so the"
            echo "::error::assertion this step exists for was never tested."
            exit 1
          fi

          # 2. And it has to have failed *there*: either the build tool itself
          #    refused, or it exited zero having written nothing and kosong
          #    caught that (SiteError::NoBuildOutput, "wrote nothing").
          if ! grep -qE '`npm` failed|wrote nothing' "$WORK/broken.log"; then
            echo "::error::the publish reached the build and then failed for"
            echo "::error::some other reason. Read the log above."
            exit 1
          fi

          # 3. The deploy must never have been attempted. This is the step's
          #    own title, asserted directly rather than inferred from the site
          #    still being up — a deploy that ran and happened to be harmless
          #    would otherwise pass unnoticed.
          if grep -q 'pages deploy' "$WORK/broken.log"; then
            echo "::error::a broken build reached the deploy step"
            exit 1
          fi

          echo "Confirmed: the publish failed at the build, before any deploy."

          # 4. And the deployment that was already live is still serving.
          curl -fsS "$URL" | grep -q "Live Smoke ${GITHUB_RUN_ID}"
          echo "Confirmed: the known-good deployment survived a failed build."

      - name: Clean up
        # Always, including after a failure: a leaked repository or Pages
        # project is a real cost and a real disclosure.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          gh repo delete "$SMOKE_NAME" --yes
          wrangler pages project delete "$SMOKE_NAME" --yes
          echo "cleanup attempted for $SMOKE_NAME"
