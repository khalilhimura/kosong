version: 2

# The workflows pin third-party actions to commits, which is the point: a
# floating tag can be moved under us. The cost is that a pin never updates
# itself, and unlike a stale tag it goes stale *invisibly* — including through
# a security fix. This is the counterweight. Dependabot opens a pull request
# when a pinned action publishes a new version, and rewrites both the commit
# and the `# vX.Y.Z` comment beside it.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One pull request listing every action that moved, rather than four
    # arriving separately. Actions are updated together or not at all.
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Bump"
    labels: ["dependencies"]
    # A stuck update should be visible, not silently queued behind others.
    open-pull-requests-limit: 3

  # The Rust workspace. `cargo deny check` already fails CI on a published
  # advisory, so this is not the security net — it is what keeps the tree
  # current enough that the day an advisory does land, the fix is one version
  # away rather than a year of upgrades away.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Routine movement, reviewed together. Most of it lands in Cargo.lock
      # alone, since the manifest asks for loose ranges.
      cargo-minor:
        update-types: ["minor", "patch"]
      # Majors stay separate on purpose. Clippy runs with `-D warnings`, so a
      # breaking release fails CI, and finding out which of six crates did it
      # should not require unpicking one pull request.
      cargo-major:
        update-types: ["major"]
    commit-message:
      prefix: "Bump"
    labels: ["dependencies"]
    open-pull-requests-limit: 5

  # The Worker API. Its dependencies decide what the deployed service runs, so
  # they are watched; the site template's are deliberately not. That template
  # ships without a lockfile on purpose — its CI job installs fresh so an
  # upstream break surfaces here before it reaches a user's site — and pinning
  # its ranges would defeat the arrangement.
  - package-ecosystem: npm
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
      # wrangler, vitest, and typescript are all a major apart from breaking
      # the build in different ways. Each deserves its own diff.
      npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "Bump"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
