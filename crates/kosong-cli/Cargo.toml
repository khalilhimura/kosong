[package]
name = "kosong-cli"
description = "Beginner-first command line for making, understanding, and publishing one Markdown page."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kosong"
path = "src/main.rs"

[dependencies]
kosong-core = { workspace = true }
clap = { workspace = true }
camino = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Only to restore default SIGPIPE handling; see main.rs.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Encodes document bodies for the scripted API in tests/sync_conflict.rs.
# Already in the tree via kosong-core.
base64 = { workspace = true }
