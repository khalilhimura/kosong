[workspace]
resolver = "2"
members = ["crates/kosong-core", "crates/kosong-cli"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/khalilhimura/kosong"

[workspace.dependencies]
# Must track `[workspace.package] version` above, and lives here so the two are
# read together. A path dependency still has to satisfy its own requirement, so
# bumping the workspace to 0.2.0 while this said "0.1.0" failed the whole build
# with `failed to select a version for the requirement kosong-core = "^0.1.0"` —
# a message that never mentions the version bump that caused it.
kosong-core = { path = "crates/kosong-core", version = "0.2.1" }

serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
toml = "1.1"
thiserror = "2"
camino = { version = "1", features = ["serde1"] }
clap = { version = "4", features = ["derive"] }
directories-next = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# rustls rather than native-tls: one fewer system dependency to explain when a
# beginner's install fails.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    # The system trust store, not a bundled root set: a user behind a
    # corporate proxy that re-signs TLS should not have to debug why kosong
    # alone cannot reach the network.
    "rustls-native-certs",
    "charset",
    "http2",
] }
tokio = { version = "1", features = ["rt", "macros", "time", "process"] }
base64 = "0.23"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
ulid = "3"

[profile.release]
lto = "thin"
strip = true
